# HTTPS 覆盖编排：与根目录 docker-compose.yml 叠加使用
# 用法：docker compose -f docker-compose.yml -f deploy/docker/docker-compose.https.yml up -d
# 说明：由 deploy/deploy.sh --https 自动附加；证书位于 deploy/nginx/certs/
services:
  frontend:
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx/nginx.https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro

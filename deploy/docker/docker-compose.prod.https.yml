# HTTPS 覆盖编排（生产 · 镜像直用型）：与根目录 docker-compose.prod.yml 叠加使用
# 用法：
#   docker compose -f docker-compose.prod.yml \
#                  -f deploy/docker/docker-compose.prod.https.yml up -d
# 说明：
#   - 证书置于 deploy/nginx/certs/server.crt|server.key（自签或正式证书均可）
#   - 覆盖 nginx 站点配置为 nginx.https.conf（80 跳 443 + /api 反代 backend:8000）
#   - 不挂载 ./frontend/dist：生产镜像内已含前端构建产物，避免被宿主目录覆盖
services:
  frontend:
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./logs/nginx:/var/log/nginx
      - ./deploy/nginx/nginx.https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro

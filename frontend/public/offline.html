<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <title>离线 · 运营智脑</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(120% 120% at 20% 0%, #1e3a8a 0%, #0f172a 60%, #020617 100%);
        color: #e2e8f0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        width: 100%;
        text-align: center;
        background: rgba(15, 23, 42, 0.7);
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 16px;
        padding: 32px 24px;
        backdrop-filter: blur(6px);
      }
      .logo {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        display: block;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 12px;
        letter-spacing: 0.5px;
      }
      p {
        font-size: 14px;
        line-height: 1.7;
        color: #94a3b8;
        margin: 0 0 24px;
      }
      button {
        appearance: none;
        border: none;
        cursor: pointer;
        background: #2563eb;
        color: #fff;
        font-size: 14px;
        padding: 10px 22px;
        border-radius: 10px;
        transition: background 0.2s ease;
      }
      button:hover {
        background: #1d4ed8;
      }
      .tip {
        margin-top: 18px;
        font-size: 12px;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="logo" src="/icons/icon-192.png" alt="运营智脑" />
      <h1>当前处于离线状态</h1>
      <p>无法连接到运营智脑服务。请检查网络或本地后端（Docker）是否已启动，恢复后点击下方按钮重试。</p>
      <button type="button" onclick="location.replace('/')">重新连接</button>
      <div class="tip">提示：OpsCompass 本地版需 Docker 服务运行中，数据不会因离线丢失。</div>
    </main>
  </body>
</html>
